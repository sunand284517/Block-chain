# MANASHAKTII QLoRA Fine-Tuning Hyperparameters
model:
  base_model: "google/gemma-2b-it"
  torch_dtype: "float16"
  load_in_4bit: true
  quant_type: "nf4"

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 3
  logging_steps: 10
  output_dir: "./checkpoints/manashaktii-gemma-2b"
  optim: "paged_adamw_8bit"

export:
  target_format: "mediapipe_int4"
  max_sequence_length: 512
